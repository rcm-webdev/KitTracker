services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kittracker
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-use-openssl-rand-base64-32}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      CLIENT_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kittracker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kittracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
